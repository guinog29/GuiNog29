<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-label="Terminal: Guilherme Mathias, Analista Desenvolvedor .NET Pleno. Stack: C#, .NET, Entity Framework, SQL Server, Oracle, React, Angular, TypeScript, Docker, Kubernetes, Azure DevOps, RabbitMQ.">
  <title>Guilherme Mathias — Analista Desenvolvedor .NET Pleno</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0a1f16"/>
    </linearGradient>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; }
      .dim { fill: #7d8590; }
      .txt { fill: #e6edf3; }
      .key { fill: #3fb950; font-weight: 700; }
      .acc { fill: #58a6ff; }
      .prompt { fill: #3fb950; }
      .big { font-size: 58px; font-weight: 700; fill: #3fb950; }
      .mid { font-size: 20px; font-weight: 700; fill: #e6edf3; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
    </style>
  </defs>

  <!-- janela -->
  <rect x="1" y="1" width="898" height="468" rx="12" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
  <path d="M1 13 a12 12 0 0 1 12 -12 h874 a12 12 0 0 1 12 12 v34 h-898 z" fill="#161b22"/>
  <line x1="1" y1="47" x2="899" y2="47" stroke="#30363d"/>
  <circle cx="28" cy="24" r="7" fill="#ff5f56"/>
  <circle cx="52" cy="24" r="7" fill="#ffbd2e"/>
  <circle cx="76" cy="24" r="7" fill="#27c93f"/>
  <text x="450" y="29" text-anchor="middle" class="dim">GuiNog29 / README.md</text>

  <!-- prompt -->
  <text x="32" y="82" class="prompt">guinog29@github</text><text x="176" y="82" class="dim">~</text><text x="194" y="82" class="txt">$ neofetch --live</text>

  <!-- bloco esquerdo -->
  <rect x="32" y="104" width="210" height="190" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="137" y="184" text-anchor="middle" class="big">.NET</text>
  <text x="137" y="222" text-anchor="middle" class="mid">&gt;_ C#</text>
  <text x="137" y="252" text-anchor="middle" class="dim" style="font-size:13px">back-end · microsserviços</text>
  <text x="137" y="272" text-anchor="middle" class="dim" style="font-size:13px">clean code</text>

  <!-- informações -->
  <g>
    <text x="270" y="124"><tspan class="key">guilherme</tspan><tspan class="dim">@</tspan><tspan class="key">mathias</tspan></text>
    <line x1="270" y1="134" x2="868" y2="134" stroke="#30363d" stroke-dasharray="3 4"/>

    <text x="270" y="162" class="key">Nome</text><text x="390" y="162" class="txt">Guilherme Mathias de Almeida</text>
    <text x="270" y="188" class="key">Usuário</text><text x="390" y="188" class="acc">@GuiNog29</text>
    <text x="270" y="214" class="key">Função</text><text x="390" y="214" class="txt">Analista Desenvolvedor .NET Pleno</text>
    <text x="270" y="240" class="key">Foco</text><text x="390" y="240" class="txt">Sistemas rápidos, escaláveis e de alta qualidade</text>

    <line x1="270" y1="256" x2="868" y2="256" stroke="#30363d" stroke-dasharray="3 4"/>

    <text x="270" y="284" class="key">Back-end</text><text x="390" y="284" class="txt">C# · .NET · Entity Framework · SQL Server · Oracle</text>
    <text x="270" y="310" class="key">Front-end</text><text x="390" y="310" class="txt">React · Angular · TypeScript · JavaScript</text>
    <text x="270" y="336" class="key">Infra</text><text x="390" y="336" class="txt">Docker · Kubernetes · Azure DevOps · RabbitMQ</text>
    <text x="270" y="362" class="key">Prática</text><text x="390" y="362" class="txt">SCRUM · Kanban · Code Review · Testes unitários</text>
  </g>

  <!-- paleta -->
  <g transform="translate(270 386)">
    <rect width="26" height="12" fill="#ff5f56"/><rect x="26" width="26" height="12" fill="#ffbd2e"/>
    <rect x="52" width="26" height="12" fill="#27c93f"/><rect x="78" width="26" height="12" fill="#58a6ff"/>
    <rect x="104" width="26" height="12" fill="#bc8cff"/><rect x="130" width="26" height="12" fill="#39c5cf"/>
  </g>

  <!-- prompt final -->
  <text x="32" y="440" class="prompt">guinog29@github</text><text x="176" y="440" class="dim">~</text><text x="194" y="440" class="txt">$</text><rect class="cursor" x="212" y="426" width="9" height="17" fill="#e6edf3"/>
</svg>
